# testmon lab: full test run with per-test coverage for each upstream commit listed in lab/config.json.
# Each job is independent; results are uploaded as one artifact per commit.
name: lab-dataset
run-name: lab ${{ inputs.backfill && 'backfill' || inputs.sha || 'config' }}

# Started one commit at a time by tools/autotester/lab_driver.py in testmon-dev (throttled).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Upstream commit to test; empty = all shas in lab/config.json"
        required: false
        default: ""
      backfill:
        description: "Instead of testing: copy existing lab-<sha> artifacts to R2; max count (all = every one)"
        required: false
        default: ""

jobs:
  setup:
    if: ${{ !inputs.backfill }}
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.cfg.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$SHA" ]; then
            echo "config=$(jq -c --arg s "$SHA" '.shas = [$s]' lab/config.json)" >> "$GITHUB_OUTPUT"
          else
            echo "config=$(jq -c . lab/config.json)" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: setup
    name: ${{ matrix.sha }}
    runs-on: ${{ fromJSON(needs.setup.outputs.config).runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.setup.outputs.config).max_parallel }}
      matrix:
        sha: ${{ fromJSON(needs.setup.outputs.config).shas }}
    env:
      CFG: ${{ needs.setup.outputs.config }}
      OUT: ${{ github.workspace }}/lab-out
      HOST_OS: linux
      CI: "True"
      COMPOSE_PARALLEL_LIMIT: 1
      COREDIS_REDIS_VERSION: ${{ fromJSON(needs.setup.outputs.config).redis }}
      COREDIS_RUNTIME_CHECKS: "True"
      COREDIS_UVLOOP: "False"
      HATCH_BUILD_HOOKS_ENABLE: "0" # pure Python: mypyc-compiled modules are invisible to coverage
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ fromJSON(needs.setup.outputs.config).upstream }}
          ref: ${{ matrix.sha }}
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ fromJSON(needs.setup.outputs.config).python }}
      - name: Install (locked)
        run: |
          mkdir -p "$OUT"
          start=$(date +%s.%N)
          uv sync --locked --all-extras --group ci --group dev
          echo "install_seconds=$(echo "$(date +%s.%N) - $start" | bc)" >> "$OUT/meta.env"
          cp uv.lock "$OUT/uv.lock"
          uv pip freeze > "$OUT/freeze.txt"
      - name: Tests with per-test coverage
        run: |
          params=$(jq -r .test_params <<< "$CFG")
          # pytest-timeout is a coredis dependency only since 2026-01
          if uv run --no-sync python -c "import pytest_timeout" 2>/dev/null; then params="--timeout=60 $params"; fi
          start=$(date +%s.%N)
          set +e
          eval uv run --no-sync pytest --reruns 2 \
            --cov=coredis --cov-context=test --cov-report= \
            --junitxml="$OUT/junit.xml" -o junit_family=xunit1 \
            -p no:cacheprovider $params 2>&1 | tee "$OUT/pytest.log"
          rc=${PIPESTATUS[0]}
          set -e
          end=$(date +%s.%N)
          {
            echo "sha=${{ matrix.sha }}"
            echo "pytest_exit=$rc"
            echo "pytest_seconds=$(echo "$end - $start" | bc)"
            echo "runner=$RUNNER_NAME"
            echo "python=$(uv run --no-sync python -V)"
            echo "commit_date=$(git show -s --format=%cI HEAD)"
          } >> "$OUT/meta.env"
          mv .coverage "$OUT/coverage.sqlite"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.sha }}
          path: lab-out/
          retention-days: 90
      # Durable copy (artifacts expire after 90 days). Soft: a failed upload keeps the GHA artifact.
      - name: Upload to R2
        if: always()
        continue-on-error: true
        env:
          R2_TOKEN: ${{ secrets.R2_TOKEN }}
          R2_ACCOUNT: ${{ fromJSON(needs.setup.outputs.config).r2_account }}
          R2_BUCKET: ${{ fromJSON(needs.setup.outputs.config).r2_bucket }}
          KEY: ${{ fromJSON(needs.setup.outputs.config).r2_prefix }}/${{ fromJSON(needs.setup.outputs.config).upstream }}/lab-${{ matrix.sha }}.tgz
        run: |
          tar -C lab-out -czf "$RUNNER_TEMP/lab.tgz" .
          # S3 credentials from the API token: key id = token id, secret = sha256(token)
          export AWS_ACCESS_KEY_ID=$(curl -sS -H "Authorization: Bearer $R2_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT/tokens/verify" | jq -r .result.id)
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$R2_TOKEN" | sha256sum | cut -d' ' -f1) AWS_DEFAULT_REGION=auto
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          aws s3 cp --only-show-errors "$RUNNER_TEMP/lab.tgz" "s3://$R2_BUCKET/$KEY" \
            --endpoint-url "https://$R2_ACCOUNT.r2.cloudflarestorage.com"

  backfill:
    if: ${{ inputs.backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      R2_TOKEN: ${{ secrets.R2_TOKEN }}
      LIMIT: ${{ inputs.backfill }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          export R2_ACCOUNT=$(jq -r .r2_account lab/config.json) R2_BUCKET=$(jq -r .r2_bucket lab/config.json)
          upstream=$(jq -r '.r2_prefix + "/" + .upstream' lab/config.json)
          # one-off: remove objects written before the testmon/ prefix existed
          export AWS_ACCESS_KEY_ID=$(curl -sS -H "Authorization: Bearer $R2_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT/tokens/verify" | jq -r .result.id)
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$R2_TOKEN" | sha256sum | cut -d' ' -f1) AWS_DEFAULT_REGION=auto
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          for k in probe.txt alisaifee/coredis/lab-028aa7d677f98f3a0bf4e2f76e6f508370d61f18.tgz; do
            aws s3 rm --only-show-errors "s3://$R2_BUCKET/$k" --endpoint-url "https://$R2_ACCOUNT.r2.cloudflarestorage.com" || true
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | select(.name | startswith("lab-")) | "\(.id) \(.name)"' \
            | sort -k2,2 -u > arts.txt
          [ "$LIMIT" != "all" ] && head -n "$LIMIT" arts.txt > a && mv a arts.txt
          wc -l arts.txt
          while read -r id name; do
            rm -rf d && mkdir d
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > a.zip && unzip -q a.zip -d d
            tar -C d -czf "$name.tgz" .
            echo "$name"; lab/r2_put.sh "$name.tgz" "$upstream/$name.tgz"
          done < arts.txt
